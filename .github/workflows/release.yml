name: Release
on:
  release:
    types: [published]
jobs:
  release:
    permissions:
      id-token: write
      packages: write
      contents: read
    environment: publish
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up dotnet.
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - name: Build
        run: dotnet build --configuration Release Personnummer -p:VersionPrefix=${{ github.event.release.tag_name }}
      - name: Package
        run: dotnet pack --configuration Release Personnummer -p:VersionPrefix=${{ github.event.release.tag_name }}
      - name: publish GH
        run: dotnet nuget push Personnummer/bin/Release/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} -s https://nuget.pkg.github.com/Personnummer/index.json
      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: publish Nuget
        run: dotnet nuget push Personnummer/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
