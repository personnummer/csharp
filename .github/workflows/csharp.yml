name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-fx:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up dotnet ${{ matrix.version }}.
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "11.0.x"
      - name: Build
        run: dotnet build --framework net48
      - name: Run test suite
        run: dotnet test --framework net48
  test-net:
    strategy:
      matrix:
        version:
          - "10.0"
          - "11.0"
    runs-on: ubuntu-latest
    name: Test dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up dotnet ${{ matrix.version }}.
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "${{ matrix.version }}.x"
      - name: Build
        run: dotnet build --framework net${{ matrix.version }}
      - name: Run test suite
        run: dotnet test --framework net${{ matrix.version }}

  # Single stable check for branch protection, so the ruleset does not need
  # to change when the matrix does.
  tests-passed:
    if: always()
    needs: [test-fx, test-net]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
